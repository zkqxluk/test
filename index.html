<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lukkz — Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0a0a0a; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .hub { max-width: 380px; width: 100%; text-align: center; }
    h1 { font-size: 1.5rem; margin-bottom: 6px; letter-spacing: 1px; }
    .sub { color: #888; font-size: 0.9rem; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: block; padding: 14px; background: #141414; border: 1px solid #262626; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 500; transition: 0.2s; }
    .btn:hover { background: #1f1f1f; border-color: #444; }
    
    /* Popup Overlay */
    .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; padding: 20px; transition: opacity 0.2s; }
    .hidden { display: none; }
    .modal { background: #121212; border: 1px solid #2a2a2a; border-radius: 16px; padding: 24px; max-width: 340px; width: 100%; text-align: center; }
    .modal h2 { font-size: 1.15rem; margin-bottom: 10px; }
    .modal p { color: #aaa; font-size: 0.88rem; line-height: 1.45; margin-bottom: 18px; }
    .timer { color: #fff; font-weight: 700; }
    .actions { display: flex; gap: 10px; }
    .actions button { flex: 1; padding: 11px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .go-btn { background: #ffffff; color: #000000; }
    .stay-btn { background: #222222; color: #ffffff; border: 1px solid #333; }
  </style>
</head>
<body>

  <!-- Main Portal Hub -->
  <div class="hub">
    <h1>lukkz</h1>
    <p class="sub">Choose where you want to go</p>
    <div class="links">
      <a class="btn" id="main-link" href="#">Main Profile</a>
      <a class="btn" href="https://tiktok.com">TikTok</a>
      <a class="btn" href="https://roblox.com">Roblox</a>
      <a class="btn" href="https://discord.com">Discord</a>
      <a class="btn" href="#">Side Project / Alt</a>
    </div>
  </div>

  <!-- Auto-Redirect Popup -->
  <div class="overlay" id="popup">
    <div class="modal">
      <h2>Heading to Main Profile</h2>
      <p>
        Redirecting you automatically in <span class="timer" id="count">6</span>s. 
        Press <strong>Go</strong> to jump there now, or press <strong>Stay</strong> to browse the portal hub and side links.
      </p>
      <div class="actions">
        <button class="go-btn" onclick="goMain()">Go</button>
        <button class="stay-btn" onclick="stayHere()">Stay</button>
      </div>
    </div>
  </div>

  <script>
    const isPhone = /iPhone|iPod|Android.*Mobile|Windows Phone/i.test(navigator.userAgent);
    const mainDestination = isPhone ? "https://straw.page" : "https://haunt.gg";
    document.getElementById("main-link").href = mainDestination;

    let seconds = 6;
    const countEl = document.getElementById("count");
    const popupEl = document.getElementById("popup");

    function goMain() {
      window.location.replace(mainDestination);
    }

    function stayHere() {
      clearInterval(countdown);
      popupEl.classList.add("hidden");
    }

    const countdown = setInterval(() => {
      seconds--;
      countEl.textContent = seconds;
      if (seconds <= 0) {
        goMain();
      }
    }, 1000);
  </script>

</body>
</html>
