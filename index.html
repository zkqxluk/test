<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lukkz — Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #030304;
      background-image: 
        radial-gradient(circle at 20% 25%, rgba(255, 255, 255, 0.02) 0%, transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      perspective: 1200px;
    }

    .glass-card {
      position: relative;
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.075) 0%, rgba(255, 255, 255, 0.015) 55%, rgba(255, 255, 255, 0.04) 100%);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.75),
        inset 0 1px 1px rgba(255, 255, 255, 0.35),
        inset 0 -1px 1px rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      color: #ffffff;
      transform-style: preserve-3d;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, box-shadow 0.3s ease;
      overflow: hidden;
      cursor: pointer;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        420px circle at var(--mouse-x, 50%) var(--mouse-y, 0%),
        rgba(255, 255, 255, 0.22),
        transparent 60%
      );
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .glass-card::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -30%;
      width: 160%;
      height: 100%;
      background: linear-gradient(115deg, rgba(255, 255, 255, 0.06) 0%, rgba(255, 255, 255, 0.01) 45%, transparent 60%);
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .glass-card:hover::before {
      opacity: 0.2;
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.32);
      box-shadow: 
        0 28px 60px rgba(0, 0, 0, 0.85),
        inset 0 1px 2px rgba(255, 255, 255, 0.55),
        inset 0 -1px 1px rgba(255, 255, 255, 0.1);
    }

    .hero-card {
      padding: 46px 24px;
    }

    .hero-icon {
      width: 34px;
      height: 34px;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.45));
    }

    .hero-card h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .hero-card p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 24px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .mini-card {
      padding: 28px 16px;
      border-radius: 22px;
    }

    .mini-icon {
      width: 22px;
      height: 22px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.35));
    }

    .mini-card h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .mini-card p {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 18px;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      color: #ffffff;
      font-weight: 500;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
      position: relative;
      z-index: 2;
    }

    .hero-btn {
      padding: 12px 34px;
      font-size: 0.98rem;
      min-width: 210px;
      justify-content: space-between;
    }

    .mini-btn {
      padding: 8px 20px;
      font-size: 0.82rem;
      min-width: 115px;
      justify-content: space-between;
    }

    .glass-card:hover .pill-btn {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.38);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 999;
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal {
      position: relative;
      width: 100%;
      max-width: 310px;
      background: linear-gradient(160deg, rgba(16, 16, 19, 0.92) 0%, rgba(7, 7, 9, 0.96) 100%);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border-radius: 26px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.95),
        inset 0 1px 1px rgba(255, 255, 255, 0.45),
        inset 0 -1px 1px rgba(255, 255, 255, 0.08);
      padding: 26px 22px 22px;
      text-align: center;
    }

    .modal-icon {
      width: 38px;
      height: 38px;
      margin: 0 auto 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal p {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .countdown-display {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin: 6px 0 18px;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px 0;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-go {
      background: #ffffff;
      color: #050505;
      border: 1px solid #ffffff;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.22);
    }

    .btn-go:hover {
      background: #e6e6e6;
      transform: translateY(-1px);
    }

    .btn-stay {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .btn-stay:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.35);
    }

    @media (max-width: 720px) {
      .mini-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .hero-card {
        padding: 36px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <a class="glass-card hero-card tilt-card" id="main-link" href="#">
      <svg class="hero-icon" viewBox="0 0 24 24" fill="white">
        <path d="M12 1L14.8 9.2L23 12L14.8 14.8L12 23L9.2 14.8L1 12L9.2 9.2L12 1Z"/>
      </svg>
      <h1>/luk</h1>
      <p>See all my links.</p>
      <div class="pill-btn hero-btn">
        <span></span>
        <span>Enter</span>
        <span>&rarr;</span>
      </div>
    </a>

    <div class="mini-grid">
      <a class="glass-card mini-card tilt-card" href="https://tiktok.com" target="_blank">
        <svg class="mini-icon" viewBox="0 0 24 24" fill="white">
          <path d="M12 1L14.8 9.2L23 12L14.8 14.8L12 23L9.2 14.8L1 12L9.2 9.2L12 1Z"/>
        </svg>
        <h2>/backrooms</h2>
        <p>Easter-egg page.</p>
        <div class="pill-btn mini-btn">
          <span></span>
          <span>go to</span>
          <span>&rarr;</span>
        </div>
      </a>

      <a class="glass-card mini-card tilt-card" href="https://roblox.com" target="_blank">
        <svg class="mini-icon" viewBox="0 0 24 24" fill="white">
          <path d="M12 1L14.8 9.2L23 12L14.8 14.8L12 23L9.2 14.8L1 12L9.2 9.2L12 1Z"/>
        </svg>
        <h2>/caseoh</h2>
        <p>Fan made link page for caseoh.</p>
        <div class="pill-btn mini-btn">
          <span></span>
          <span>go to</span>
          <span>&rarr;</span>
        </div>
      </a>

      <a class="glass-card mini-card tilt-card" href="https://discord.com" target="_blank">
        <svg class="mini-icon" viewBox="0 0 24 24" fill="white">
          <path d="M12 1L14.8 9.2L23 12L14.8 14.8L12 23L9.2 14.8L1 12L9.2 9.2L12 1Z"/>
        </svg>
        <h2>/L</h2>
        <p>Lawliet.</p>
        <div class="pill-btn mini-btn">
          <span></span>
          <span>go to</span>
          <span>&rarr;</span>
        </div>
      </a>

      <a class="glass-card mini-card tilt-card" href="#">
        <svg class="mini-icon" viewBox="0 0 24 24" fill="white">
          <path d="M12 1L14.8 9.2L23 12L14.8 14.8L12 23L9.2 14.8L1 12L9.2 9.2L12 1Z"/>
        </svg>
        <h2>Other pages</h2>
        <p>see all other pages.</p>
        <div class="pill-btn mini-btn">
          <span></span>
          <span>go to</span>
          <span>&rarr;</span>
        </div>
      </a>
    </div>
  </div>

 <div class="overlay" id="popup">
    <div class="modal">
      <div class="modal-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <p>Auto-redirecting to Main.<br>Press go to see links now or stay to browse more.</p>
      <div class="countdown-display" id="timer">10s</div>
      <div class="modal-actions">
        <button class="btn-go" onclick="goMain()">Go</button>
        <button class="btn-stay" onclick="stayHere()">Stay</button>
      </div>
    </div>
  </div>

  <script>
    const isPhone = /iPhone|iPod|Android.*Mobile|Windows Phone/i.test(navigator.userAgent);
    const mainDestination = isPhone ? "https://straw.page" : "https://haunt.gg";
    document.getElementById("main-link").href = mainDestination;

    let seconds = 6;
    const timerEl = document.getElementById("timer");
    const popupEl = document.getElementById("popup");

    function goMain() {
      window.location.replace(mainDestination);
    }

    function stayHere() {
      clearInterval(countdown);
      popupEl.classList.add("hidden");
    }

    const countdown = setInterval(function() {
      seconds--;
      timerEl.textContent = seconds + "s";
      if (seconds <= 0) {
        goMain();
      }
    }, 1000);

    document.querySelectorAll(".tilt-card").forEach(function(card) {
      card.addEventListener("mousemove", function(e) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        card.style.setProperty("--mouse-x", x + "px");
        card.style.setProperty("--mouse-y", y + "px");

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -7;
        const rotateY = ((x - centerX) / centerX) * 7;

        card.style.transform = "perspective(1000px) rotateX(" + rotateX + "deg) rotateY(" + rotateY + "deg) scale3d(1.015, 1.015, 1.015)";
      });

      card.addEventListener("mouseleave", function() {
        card.style.transform = "perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)";
      });
    });
  </script>

</body>
</html>
